<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout - Velocity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-card { background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .input-dark { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(71, 85, 105, 0.4); color: white; transition: all 0.3s; }
        .input-dark:focus { border-color: #06b6d4; outline: none; box-shadow: 0 0 0 2px rgba(6, 182, 212, 0.2); }
    </style>
    <script>
        function updatePrice() {
            const days = document.getElementById('days').value;
            const pricePerDay = parseFloat('{{ vehicle.price }}');
            const total = (days * pricePerDay).toLocaleString();
            document.getElementById('total-price').innerText = '$' + total;
            document.getElementById('btn-total').innerText = '$' + total;
        }
    </script>
</head>
<body class="min-h-screen flex items-center justify-center py-12 px-4 relative overflow-hidden">
    
    <!-- Abstract Background Elements -->
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-cyan-600/20 rounded-full blur-[120px] -translate-y-1/2 translate-x-1/3"></div>
    <div class="absolute bottom-0 left-0 w-[500px] h-[500px] bg-blue-700/20 rounded-full blur-[120px] translate-y-1/3 -translate-x-1/3"></div>

    <div class="max-w-5xl w-full glass-card rounded-[2rem] shadow-2xl overflow-hidden flex flex-col md:flex-row relative z-10">
        
        <!-- Order Summary Sidebar -->
        <div class="w-full md:w-5/12 bg-slate-900/80 p-10 flex flex-col relative border-r border-slate-700/50">
            <div class="flex items-center gap-2 mb-8 text-cyan-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"></path></svg>
                <span class="font-bold tracking-widest uppercase text-sm">Secure Transaction</span>
            </div>
            
            <div class="rounded-2xl overflow-hidden h-48 mb-6 border border-slate-700 shadow-inner relative group">
                <img src="{{ vehicle.image_url }}" alt="Vehicle" class="w-full h-full object-cover opacity-80 group-hover:opacity-100 transition duration-500 group-hover:scale-105" loading="lazy">
                <div class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-slate-900 to-transparent h-20"></div>
            </div>
            
            <h3 class="text-3xl font-black text-white mb-1 leading-tight">{{ vehicle.model_name }}</h3>
            <p class="text-cyan-400 text-sm mb-8 font-mono capitalize">{{ vehicle.location }} Sector • {{ vehicle.v_type }}-W</p>
            
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-700">
                <span class="text-slate-400 font-medium">Base Rate</span>
                <span class="text-xl font-bold">${{ vehicle.price }}<span class="text-xs text-slate-500 font-normal">/day</span></span>
            </div>
            <div class="flex justify-between items-center mb-4 pb-4 border-b border-slate-700 text-sm">
                <span class="text-slate-400 font-medium">AWS Processing Fee</span>
                <span class="text-white font-bold">$0.00</span>
            </div>
            
            <div class="mt-auto pt-6 flex justify-between items-end">
                <span class="text-sm font-bold text-slate-400 uppercase tracking-widest">Total Value</span>
                <span id="total-price" class="text-4xl font-black text-white drop-shadow-md">${{ vehicle.price }}</span>
            </div>
        </div>

        <!-- Checkout Form -->
        <div class="w-full md:w-7/12 p-10 md:p-14 bg-slate-800/30">
            <div class="flex justify-between items-center mb-10">
                <h2 class="text-2xl font-black text-white tracking-tighter">VELOCITY.</h2>
                <a href="/dashboard" class="text-sm text-slate-400 hover:text-white font-bold transition flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Abort
                </a>
            </div>

            <form action="/process_payment/{{ vehicle.vehicle_id }}" method="POST" class="space-y-8">
                
                <div class="bg-slate-900/50 p-6 rounded-2xl border border-slate-700/50">
                    <label class="block text-xs font-bold text-slate-400 uppercase tracking-widest mb-3">Deployment Duration (Days)</label>
                    <div class="flex items-center gap-4">
                        <input type="number" name="days" id="days" value="1" min="1" max="30" onchange="updatePrice()" onkeyup="updatePrice()" class="w-24 px-4 py-3 bg-slate-800 border border-slate-600 rounded-xl font-black text-xl text-center text-white focus:outline-none focus:border-cyan-500" required>
                        <span class="text-slate-500 text-sm">Valid up to 30 continuous days.</span>
                    </div>
                </div>

                <div>
                    <h3 class="text-sm font-bold text-white mb-5 flex items-center gap-2">
                        Payment Credentials
                        <span class="bg-slate-700 text-slate-300 text-[10px] px-2 py-0.5 rounded uppercase font-bold">Test Mode</span>
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <input type="text" class="w-full px-4 py-3.5 input-dark rounded-xl" placeholder="Cardholder Identity" required>
                        </div>
                        <div class="relative">
                            <svg class="w-6 h-6 absolute right-4 top-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg>
                            <input type="text" class="w-full px-4 py-3.5 input-dark rounded-xl tracking-widest font-mono" placeholder="0000 0000 0000 0000" required maxlength="19">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <input type="text" class="w-full px-4 py-3.5 input-dark rounded-xl" placeholder="MM/YY" required>
                            </div>
                            <div>
                                <input type="password" class="w-full px-4 py-3.5 input-dark rounded-xl" placeholder="CVC" required maxlength="4">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 text-white font-black text-lg py-4.5 rounded-xl shadow-[0_0_20px_rgba(6,182,212,0.4)] hover:shadow-[0_0_30px_rgba(6,182,212,0.6)] hover:scale-[1.02] transition-all flex justify-center items-center gap-3">
                    Authorize Contract — <span id="btn-total">${{ vehicle.price }}</span>
                </button>
            </form>
            
            <div class="mt-8 pt-6 border-t border-slate-700/50 flex justify-center gap-6 opacity-50 grayscale hover:grayscale-0 transition duration-500">
                <!-- Mock trust badges -->
                <div class="text-[10px] font-black tracking-widest text-white flex items-center gap-1"><svg class="w-4 h-4 text-[#FF9900]" viewBox="0 0 24 24" fill="currentColor"><path d="M14.6 15c-.4 0-.8-.3-1-.6l-1.4-2.8H7.7l-1.4 2.8c-.2.3-.6.6-1 .6-.6 0-1-.5-1-1 0-.2 0-.4.1-.5l5-9.7c.3-.6.8-.9 1.4-.9h.2c.6 0 1.2.3 1.5.9l5 9.7c.1.2.1.4.1.6 0 .6-.5 1-1 1zm-4.8-4.9h4l-2-4-2 4z"/></svg> AWS SECURE</div>
                <div class="text-[10px] font-black tracking-widest text-white flex items-center gap-1"><svg class="w-4 h-4 text-[#4053D6]" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg> 256-BIT SSL</div>
            </div>
        </div>
    </div>

</body>
</html>
