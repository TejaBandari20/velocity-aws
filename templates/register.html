<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Velocity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .hero-bg {
            background-image: linear-gradient(135deg, rgba(15,23,42,0.9), rgba(15,23,42,0.7)), url('https://images.unsplash.com/photo-1618843479313-40f8afb4b4d8?auto=format&fit=crop&w=1920&q=80');
            background-size: cover; background-position: center;
        }
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="hero-bg min-h-screen flex items-center justify-center p-4">

    <div class="glass-panel p-10 rounded-3xl shadow-[0_0_50px_rgba(0,0,0,0.5)] w-full max-w-md relative overflow-hidden my-8">
        <!-- Decoration glow -->
        <div class="absolute -top-20 -right-20 w-40 h-40 bg-cyan-500 rounded-full mix-blend-screen filter blur-[80px] opacity-40"></div>

        <div class="text-center mb-8 relative z-10">
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tighter">VELOCITY.</h1>
            <p class="text-slate-400 mt-2 font-light">Establish Database Record</p>
        </div>

        <form action="/register" method="POST" class="space-y-5 relative z-10">
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Entity Name</label>
                <input type="text" name="name" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all placeholder-slate-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Encrypted Email</label>
                <input type="email" name="email" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all placeholder-slate-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Secure Passkey</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all placeholder-slate-500">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-300 mb-1">Access Level</label>
                <select name="role" class="w-full px-4 py-3 bg-slate-800/50 border border-slate-600 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-cyan-500 transition-all appearance-none">
                    <option value="user" class="text-black">Standard User</option>
                    <option value="admin" class="text-black">System Administrator</option>
                </select>
            </div>
            <button type="submit" class="w-full bg-white text-slate-900 font-bold py-3.5 px-4 rounded-xl transition-all transform hover:scale-[1.02] shadow-xl mt-6 hover:bg-cyan-50">
                Generate Profile
            </button>
        </form>
        
        <p class="mt-6 text-center text-sm text-slate-400 relative z-10">
            Already registered? <a href="/login" class="text-cyan-400 font-semibold hover:text-cyan-300 transition">Return to Login</a>
        </p>
    </div>

</body>
</html>
